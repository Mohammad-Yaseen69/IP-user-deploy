name: Format check

on:
  pull_request:
    branches:
      - main

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check formatting
        run: npx --yes prettier@$(node -p "require('./package-lock.json').packages['node_modules/prettier'].version") --check .
