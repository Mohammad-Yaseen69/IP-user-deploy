name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Git global config for private repo access
        run: git config --global url."https://oauth2:${{ secrets.YOUR_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Switch Nginx port to Blue
        run: bash /home/ubuntu/switch-to-blue.sh

      - name: Check Node.js version
        run: |
          node -v
          npm -v


      - name: Mark repo as safe
        run: git config --global --add safe.directory /home/ubuntu/Projects/instapay

      -  name: Fix permissions
         run: |
          sudo chown -R $USER:$USER /home/ubuntu/Projects/instapay
          sudo chmod -R u+rw /home/ubuntu/Projects/instapay

      - name: Deploy
        run: |
         sudo apt-get update && sudo apt-get install -y jq
         cd /home/ubuntu/Projects/instapay
         git reset --hard
         git pull --no-rebase
         jq 'del(.type)' package.json > temp.json && mv temp.json package.json
         npm install --legacy-peer-deps
         export CI=false
         npm run build --verbose

      - name: Restarting Server
        run: |
          cd /home/ubuntu/Projects/instapay
          jq '. + {"type":"module"}' package.json > temp.json && mv temp.json package.json
          sudo pm2 restart main --update-env

      - name: Switch Nginx port to Main
        run: bash /home/ubuntu/switch-to-main.sh

      - name: Mark blue repo as safe
        run: git config --global --add safe.directory /home/ubuntu/Projects/instapay-blue

      - name: Deploy to blue server
        run: |
         sudo apt-get update && sudo apt-get install -y jq
         cd /home/ubuntu/Projects/instapay-blue
         git reset --hard
         git pull --no-rebase
         jq 'del(.type)' package.json > temp.json && mv temp.json package.json
         npm install --legacy-peer-deps
         export CI=false
         npm run build --verbose  

      - name: Restarting Blue Server
        run: |
          cd /home/ubuntu/Projects/instapay-blue
          jq '. + {"type":"module"}' package.json > temp.json && mv temp.json package.json
          sudo pm2 restart blue  --update-env
