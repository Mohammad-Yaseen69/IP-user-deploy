<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Processing…</title>
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 2rem; color: #333">
    <p>Card details received. Continuing to verification…</p>
    <script>
      (function () {
        try {
          var url = localStorage.getItem("paytently_authorize_url");
          if (url) {
            localStorage.removeItem("paytently_authorize_url");
            (window.top || window).location.href = url;
            return;
          }
        } catch (e) {}

       
        var topLevel = true;
        try { topLevel = window.top === window; } catch (e) { topLevel = false; }
        if (topLevel) {
          var guestPayment = null;
          try { guestPayment = localStorage.getItem("paytently_guest_payment_id"); } catch (e) {}
          if (guestPayment) {
            window.location.replace("/paytently/card-collected");
            return;
          }
        }

        try { window.parent.postMessage({ type: "paytently_card_collected" }, window.location.origin); } catch (e) {}
      })();
    </script>
  </body>
</html>
