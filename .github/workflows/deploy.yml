name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Git global config for private repo access
        run: git config --global url."https://oauth2:${{ secrets.YOUR_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Switch Nginx port to Blue
        run: bash /home/ubuntu/switch-to-blue.sh

      - name: Mark repo as safe
        run: git config --global --add safe.directory /home/ubuntu/Projects/instapay

      - name: Deploy
        run: |
         sudo apt-get update && sudo apt-get install -y jq
         cd /home/ubuntu/Projects/instapay
         git reset --hard
         git pull --no-rebase
         jq 'del(.type)' package.json > temp.json && mv temp.json package.json
         npm install --legacy-peer-deps
         npm run build

      - name: Restarting Server
        run: |
          cd /home/ubuntu/Projects/instapay
          jq '. + {"type":"module"}' package.json > temp.json && mv temp.json package.json
          pm2 restart main

      - name: Switch Nginx port to Main
        run: bash /home/ubuntu/switch-to-main.sh
