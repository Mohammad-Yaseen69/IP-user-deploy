      @font-face {

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Hide arrows in Firefox */
      input[type="number"] {
        -moz-appearance: textfield;
      }

      @media screen and (max-width: 1000px) {
        ::-webkit-scrollbar {
          width: 2px;
          height: 2px;
        }
      }
