    <title>InstaPay</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        overflow: hidden;
        z-index: 99999;
      }

      .ip-mark {
        fill: #5a21f7;
      }

      .ip-mark-page {
        flex-shrink: 0;
        width: 160%;
        height: 100%;
        max-width: 1000px;
        max-height: 1000px;
      }

      .ip-mark path {
        animation-duration: 2.68s;
        animation-iteration-count: infinite;
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .ip-mark-square {
        animation-name: ip-mark-square;
      }

      .ip-mark-lower {
        animation-name: ip-mark-lower;
      }

      .ip-mark-upper {
        animation-name: ip-mark-upper;
      }

      .ip-mark-round {
        animation-name: ip-mark-round;
      }

      @keyframes ip-mark-square {
        0%,
        10% {
          opacity: 0;
          transform: translateX(-576px);
        }
        10.1% {
          opacity: 1;
          transform: translateX(-576px);
        }
        28%,
        100% {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes ip-mark-lower {
        0%,
        21% {
          opacity: 0;
          transform: translateY(284px);
        }
        21.1% {
          opacity: 1;
          transform: translateY(284px);
        }
        31% {
          opacity: 1;
          transform: translateY(-16px);
        }
        35%,
        100% {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes ip-mark-upper {
        0%,
        36% {
          opacity: 0;
          transform: translateY(-332px);
        }
        36.1% {
          opacity: 1;
          transform: translateY(-332px);
        }
        51%,
        100% {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes ip-mark-round {
        0%,
        58% {
          opacity: 0;
          transform: translateX(176px);
        }
        58.1% {
          opacity: 1;
          transform: translateX(176px);
        }
        67%,
        100% {
          opacity: 1;
          transform: none;
        }
      }

      @font-face {
        font-family: "EmojiOne";
        src:
          url("path/to/emojione.woff2") format("woff2"),
          url("path/to/emojione.woff") format("woff");
        font-weight: normal;
        font-style: normal;
      }

      .emoji {
        font-family: "EmojiOne", sans-serif;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(
          -24deg,
          rgb(210, 60, 122) 0%,
          rgb(164, 52, 167) 43.66%,
          rgb(88, 38, 239) 100%
        );
        border-radius: 5px;
      }

      ::-webkit-scrollbar-track {
        background-color: #e6e6e6;
      }

      ::-webkit-scrollbar-track:hover {
        background-color: #d4d4d4;
      }

      ::-webkit-scrollbar-corner {
        background-color: #fff;
      }

      /* Hide arrows in WebKit-based browsers (Chrome, Safari) */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Hide arrows in Firefox */
      input[type="number"] {
        -moz-appearance: textfield;
      }

      @media screen and (max-width: 1000px) {
        ::-webkit-scrollbar {
          width: 2px;
          height: 2px;
        }
      }
    </style>
  </head>

  <body translate="no">

    <div translate="no" id="root">

          <path class="ip-mark-square" d="M815 486h156v155H815z" />
          <path class="ip-mark-lower" d="M815 641h156v155z" />
          <path class="ip-mark-upper" d="M815 331h156v155z" />
          <path class="ip-mark-round" d="M971 331a155 155 0 0 1 0 310z" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
