name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Git global config for private repo access
        run: git config --global url."https://oauth2:${{ secrets.YOUR_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Switch Nginx port to Blue
        run: bash /home/ubuntu/switch-to-blue.sh

      - name: Deploy
        run: |
          cd /home/ubuntu/Projects/instapay
          git reset --hard
          git pull origin main
          sed -i '/"type": "module"/d' package.json
          npm install --legacy-peer-deps
          npm run build
          sed -i '2i\  "type": "module",' package.json
          pm2 restart main

      - name: Switch Nginx port to Main
        run: bash /home/ubuntu/switch-to-main.sh
