<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Processing…</title>
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 2rem; color: #333">
    <p>Card details received. Continuing to verification…</p>
    <script>
      (function () {
        function go(url, replace) {
          var w = window.top || window;
          try { replace ? w.location.replace(url) : (w.location.href = url); return true; }
          catch (e) { return false; }
        }

        var url = null;
        try { url = localStorage.getItem("paytently_authorize_url"); } catch (e) {}
        if (url) {
          try { localStorage.removeItem("paytently_authorize_url"); } catch (e) {}
          if (go(url, false)) return;
        }

        // Hosted forms only mint the authorize link once the card is collected, so
        // hand off to the app, which can call the precheck API for it.
        var pending = null;
        try {
          pending = localStorage.getItem("paytently_guest_payment_id")
            || localStorage.getItem("paytently_payment_id");
        } catch (e) {}
        if (pending && go("/paytently/card-collected", true)) return;

        try { window.parent.postMessage({ type: "paytently_card_collected" }, window.location.origin); } catch (e) {}
      })();
    </script>
  </body>
</html>
